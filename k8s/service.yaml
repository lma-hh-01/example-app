apiVersion: v1
kind: Service
metadata:
  name: example-app
  namespace: example-app
spec:
  type: NodePort
  selector:
    app: example-app
  ports:
    - port: 8080
      targetPort: 8080
      # kind forwards this port to http://localhost:8080 on the host (testbed/config/kind.yaml).
      nodePort: 30080
