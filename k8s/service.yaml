apiVersion: v1
kind: Service
metadata:
  name: example-app
  namespace: example-app
spec:
  type: NodePort
  selector:
    app: example-app
  ports:
    - port: 8080
      targetPort: 8080
      # kind leitet diesen Port auf http://localhost:8080 des Rechners weiter (testbed/config/kind.yaml).
      nodePort: 30080
