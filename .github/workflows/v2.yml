# AK-06 Fall 1: Der regulaere zentrale Aufruf bleibt, ein zusaetzlicher Job baut
# ein manipuliertes Image und signiert es mit der Identitaet dieses App-Workflows.
name: v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}-v2

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: lma-hh-01/secure-workflows/.github/workflows/v2.yml@main

  manipulate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.3
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VARIANT=ak06-manipuliert
            APP_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Manipuliertes Image mit der Identitaet dieses Workflows signieren
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
