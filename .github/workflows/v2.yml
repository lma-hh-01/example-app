# Variant V2: commit verification and build, then signature and provenance in a
# separate job, all in the central workflow in secure-workflows. This repository
# only grants the permissions, because a called workflow cannot have more
# permissions than its caller.
name: v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: lma-hh-01/secure-workflows/.github/workflows/v2.yml@main
