# Variant V3: daily repetition of the vulnerability gate for the most recently
# built image, via the central workflow in secure-workflows.
name: v3-rescan

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rescan:
    permissions:
      actions: read
    uses: lma-hh-01/secure-workflows/.github/workflows/v3-rescan.yml@main
