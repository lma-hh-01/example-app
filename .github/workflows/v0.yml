# Variant V0 (baseline): build without supply chain hardening.
# Actions referenced only by their major tag, image distributed via the tag
# "latest", no signature, no provenance, no SBOM, no scan.
name: v0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/example-app-v0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Without these two switches BuildKit creates an index with its own attestation.
          provenance: false
          sbom: false
          build-args: |
            APP_VARIANT=v0
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
