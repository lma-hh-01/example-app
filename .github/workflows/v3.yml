# Variant V3: like V2, plus checks of the workflows (zizmor) and manifests
# (Kyverno CLI), SBOM, vulnerability gate and pinned dependencies
# (Dockerfile.v3, requirements.lock). Everything runs in the central workflow in
# secure-workflows, this repository only grants the permissions.
name: v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: lma-hh-01/secure-workflows/.github/workflows/v3.yml@main
